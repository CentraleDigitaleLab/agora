version: 1

# LLM Summary Retrieval strategy selector. Summary generation is still a stub
# until stories #42 and #43 land.
llm_summary_retrieval: false
summary_model: "gemma"
summary_granularity: "chapter"
max_summary_length: 5
index_raw_chunks: true

defaults:
  include_globs: ["**/*.md", "**/*.qmd", "**/*.Rmd"]
  exclude_dirs: [".git", "_book", "docs", ".quarto", "renv", ".github", "node_modules", "build", "dist", "site"]
  default_lang: "en"
  follow_symlinks: false

vector_index:
  vectors:
    - name: dense
      kind: dense
    # Optional hybrid sparse vector:
    # - name: sparse
    #   kind: sparse
    #   model: Qdrant/bm25
    # Optional late-interaction multivector:
    # - name: multi
    #   kind: multi
    #   model: answerdotai/answerai-colbert-small-v1

sources:
  utilitr:
    kind: markdown_repo
    repo_path: "../utilitR"
    base_url: "https://book.utilitr.org/"
    repo_url_template: "https://github.com/InseeFrLab/utilitR/blob/{commit}/{path}"
    default_lang: "fr"
    # Optional parent-child retrieval:
    # parent_storage_mode: classic
    # parent_target_tokens: 1000
    # parent_overlap_tokens: 120
    # parent_max_tokens: 1500
